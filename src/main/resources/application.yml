spring:
  application:
    name: docquery

  datasource:
    url: jdbc:postgresql://localhost:5433/docquery
    username: docquery
    password: localdev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
      chat:
        options:
          model: gpt-4o-mini
      vectorstore:
        pgvector:
          initialize-schema: false
          index-type: HNSW
          distance-type: COSINE_DISTANCE
          dimensions: 1536

docquery:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-long-random-32byte-string}
    expiration-ms: 3600000
  storage:
    location: ./uploads