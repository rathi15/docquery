spring:
  application:
    name: docquery

  datasource:
    url: jdbc:postgresql://localhost:5433/docquery
    username: docquery
    password: localdev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

docquery:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-long-random-32byte-string}
    expiration-ms: 3600000
  storage:
    location: ./uploads